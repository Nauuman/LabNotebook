<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Paycheck Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky ledger header with month switcher, tab strip, then one working view per tab in a 1120px column. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --surface-2: #eaeee8; --ink: #15211b; --ink-2: #46544c; --muted: #6a776f;
  --line: #d7ddd5; --accent: #1d6b50; --accent-ink: #ffffff; --accent-soft: #d9eae1;
  --good: #1c7a3d; --warn: #9a5c00; --bad: #b3261e; --good-soft: #dcefe2; --warn-soft: #f6ead3; --bad-soft: #f7dedb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #8b958f;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --surface: #161d19; --surface-2: #1d2621; --ink: #e6ede8; --ink-2: #b3bfb8; --muted: #8b978f;
  --line: #2b3530; --accent: #5cc79a; --accent-ink: #0a1a12; --accent-soft: #1b3a2c;
  --good: #63cc86; --warn: #e2a640; --bad: #f2756b; --good-soft: #183323; --warn-soft: #3a2c12; --bad-soft: #3d1c1a;
  --s1: #3987e5; --s2: #d95926; --s3: #6f7a74; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161d19; --surface-2: #1d2621; --ink: #e6ede8; --ink-2: #b3bfb8; --muted: #8b978f;
  --line: #2b3530; --accent: #5cc79a; --accent-ink: #0a1a12; --accent-soft: #1b3a2c;
  --good: #63cc86; --warn: #e2a640; --bad: #f2756b; --good-soft: #183323; --warn-soft: #3a2c12; --bad-soft: #3d1c1a;
  --s1: #3987e5; --s2: #d95926; --s3: #6f7a74; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 1.4rem; font-weight: 700; }
.brand .stamp { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
.month-nav { display: flex; align-items: center; gap: 4px; }
.month-nav .label { font-family: var(--display); font-weight: 700; min-width: 9.5ch; text-align: center; }
.save-state { font-size: 0.78rem; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; color: var(--ink-2); font: 500 0.92rem var(--body); padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

main { padding-block: 22px 60px; display: grid; gap: 22px; }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; align-content: start; }
.panel-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel-head h2, .panel-head h3 { margin-right: auto; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 22px; }

button, .btn { font: 500 0.88rem var(--body); border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--ink-2); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { border-color: transparent; background: transparent; color: var(--ink-2); padding: 6px 8px; }
button.ghost:hover { background: var(--surface-2); }
button.danger { color: var(--bad); }
button.icon { width: 34px; height: 34px; padding: 0; display: inline-grid; place-items: center; font-size: 1.1rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.banner { border: 1px dashed var(--warn); background: var(--warn-soft); border-radius: var(--r); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner p { margin: 0; flex: 1 1 300px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 165px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.kpi .v { font: 500 1.35rem var(--mono); font-variant-numeric: tabular-nums; }
.kpi .sub { font-size: 0.8rem; color: var(--muted); }

table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
.scroll-x { overflow-x: auto; min-width: 0; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }

.list { display: grid; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 500; overflow-wrap: anywhere; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

/* statement: the month as a running ledger */
.statement { display: grid; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.92rem; }
.statement .ln { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
.statement .ln span:first-child { font-family: var(--body); }
.statement > .small { font-family: var(--body); }
.statement .ln.total { border-bottom: 0; border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 8px; font-weight: 500; font-size: 1.02rem; }

.bars { display: grid; gap: 4px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 1.1fr) 3fr auto; gap: 10px; align-items: center; padding: 6px 4px; border-radius: 6px; cursor: pointer; border: 0; background: none; text-align: left; width: 100%; font: inherit; color: inherit; }
.bar-row:hover { background: var(--surface-2); }
.bar-track { height: 12px; border-radius: 0 4px 4px 0; background: var(--surface-2); position: relative; overflow: hidden; }
.bar-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-val { font-family: var(--mono); font-size: 0.86rem; text-align: right; white-space: nowrap; }
.bar-sub { margin: 0 0 8px 12px; padding-left: 12px; border-left: 2px solid var(--line); display: grid; gap: 2px; }
.bar-sub .ln { display: flex; justify-content: space-between; gap: 12px; font-size: 0.86rem; padding: 2px 0; }

.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.meter.warn > i { background: var(--warn); }
.meter.bad > i { background: var(--bad); }

.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; background: var(--surface); align-content: start; }
.tile .top { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 0.86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }

.tips { display: grid; gap: 10px; }
.tip { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); }
.tip .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 0.8rem var(--mono); background: var(--accent-soft); color: var(--accent); }
.tip.warn .mark { background: var(--warn-soft); color: var(--warn); }
.tip.bad .mark { background: var(--bad-soft); color: var(--bad); }
.tip.good .mark { background: var(--good-soft); color: var(--good); }
.tip p { margin: 0; }
.tip b { font-weight: 600; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; }
.chart .tt { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; box-shadow: 0 4px 14px rgb(0 0 0 / 0.12); min-width: 150px; }
.chart .tt .ln { display: flex; justify-content: space-between; gap: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.timeline { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.payday { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 120px; display: grid; gap: 2px; }
.payday .d { font-family: var(--display); font-weight: 700; }

.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.empty button { margin-top: 8px; }

.cat-block { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.items { display: flex; flex-wrap: wrap; gap: 6px; }
.item-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; background: var(--surface); cursor: pointer; color: var(--ink); }
.item-chip .note { color: var(--muted); font-size: 0.78rem; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgb(8 14 11 / 0.45); z-index: 20; display: grid; place-items: center; padding: 16px; padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: min(480px, 100%); max-height: 100%; overflow: auto; padding: 20px; display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 0.82rem; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 0.76rem; color: var(--muted); }
input, select, textarea { font: 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.modal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.modal-actions .left { margin-right: auto; }
.err { color: var(--bad); font-size: 0.82rem; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 0.86rem; z-index: 30; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
.inline-form .field { flex: 1 1 160px; }
@media (prefers-reduced-motion: no-preference) { .bar-fill, .meter > i { transition: width .3s ease; } }
@media (max-width: 560px) { .bar-row { grid-template-columns: 1fr auto; } .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand"><h1>Paycheck Ledger</h1><span class="stamp" id="today-stamp"></span></div>
      <span class="save-state" id="save-state">Opening…</span>
      <div class="month-nav" aria-label="Month">
        <button class="ghost icon" data-action="month-prev" aria-label="Previous month">‹</button>
        <span class="label" id="month-label"></span>
        <button class="ghost icon" data-action="month-next" aria-label="Next month">›</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap" id="view">
  <section class="panel"><p class="muted">Opening your budget…</p></section>
</main>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';
// ---------- helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const mkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const dim = (y, m) => new Date(y, m + 1, 0).getDate();
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const sum = (a, f = x => x) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const round2 = n => Math.round(n * 100) / 100;
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
const fmtDate = (d, opts = { month: 'short', day: 'numeric' }) => d.toLocaleDateString(undefined, opts);
let fmtCache = {};
function money(n, dec = 2) {
  const cur = (S && S.settings.currency) || 'USD';
  const k = cur + dec;
  if (!fmtCache[k]) { try { fmtCache[k] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur, minimumFractionDigits: dec, maximumFractionDigits: dec }); } catch { fmtCache[k] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', minimumFractionDigits: dec, maximumFractionDigits: dec }); } }
  return fmtCache[k].format(Math.abs(n) < 0.005 ? 0 : n);
}
const m0 = n => money(n, 0);

const FREQ = { weekly: { label: 'Weekly', perMonth: 52 / 12 }, biweekly: { label: 'Every 2 weeks', perMonth: 26 / 12 }, semimonthly: { label: 'Twice a month (15th & last day)', perMonth: 2 }, monthly: { label: 'Monthly', perMonth: 1 } };
const CARD_KINDS = ['Cashback', 'Travel rewards', 'Points', 'Store card', 'Balance transfer', 'Secured', 'Business', 'Other'];
const ACCT_KINDS = ['Savings', 'High-yield savings', 'Checking', 'Money market', 'Cash', 'Other'];

// ---------- state ----------
let S = null;
let view = { tab: 'overview', month: mkey(today()), openCats: {}, strategy: null, inclBills: true };
try { const t = localStorage.getItem('pl-tab'); if (t) view.tab = t; } catch {}
if (location.hash && location.hash.length > 1) view.tab = location.hash.slice(1);

function blankState() {
  const cats = [
    ['Housing', ['Rent / mortgage', 'Renter\'s insurance', 'Repairs']],
    ['Food', ['Groceries', 'Dining out', 'Coffee']],
    ['Transport', ['Gas', 'Car insurance', 'Transit', 'Parking']],
    ['Utilities', ['Electric', 'Internet', 'Phone', 'Water']],
    ['Health', ['Pharmacy', 'Doctor', 'Gym']],
    ['Subscriptions', ['Streaming', 'Apps']],
    ['Shopping', ['Clothes', 'Household']],
    ['Fun', ['Concerts', 'Hobbies', 'Travel']],
    ['Other', ['Gifts', 'Misc']]
  ].map(([name, items]) => ({ id: uid(), name, items: items.map(label => ({ id: uid(), label, note: '' })) }));
  return { version: 1, example: false, settings: { currency: 'USD', bufferMonths: 3, strategy: 'avalanche', debtBudgetOverride: null },
    categories: cats, expenses: [], cards: [], accounts: [], pay: [], payables: [], goals: [], carry: { amount: 0, history: [] } };
}

function exampleState() {
  const s = blankState(); s.example = true;
  const cat = n => s.categories.find(c => c.name === n);
  const item = (c, l) => cat(c).items.find(i => i.label === l).id;
  const t = today();
  let fri = addDays(t, (5 - t.getDay() + 7) % 7 || 7);
  s.pay = [
    { id: uid(), source: 'Main job (example)', amount: 2150, frequency: 'biweekly', nextDate: iso(fri) },
    { id: uid(), source: 'Weekend tutoring (example)', amount: 320, frequency: 'monthly', nextDate: iso(new Date(t.getFullYear(), t.getMonth() + (t.getDate() >= 28 ? 1 : 0), 28)) }
  ];
  s.cards = [
    { id: uid(), name: 'Everyday Cashback', kind: 'Cashback', balance: 2340, limit: 6000, apr: 24.99, minPay: 70, dueDay: 18 },
    { id: uid(), name: 'Travel Rewards', kind: 'Travel rewards', balance: 4120, limit: 10000, apr: 21.49, minPay: 110, dueDay: 5 },
    { id: uid(), name: 'Department store', kind: 'Store card', balance: 640, limit: 1500, apr: 29.99, minPay: 35, dueDay: 25 },
    { id: uid(), name: 'Balance transfer', kind: 'Balance transfer', balance: 1800, limit: 4000, apr: 0, minPay: 50, dueDay: 12 }
  ];
  s.accounts = [
    { id: uid(), name: 'High-yield savings', kind: 'High-yield savings', balance: 3200 },
    { id: uid(), name: 'Checking', kind: 'Checking', balance: 1450 }
  ];
  const pb = (name, amount, c, l, dueDay) => ({ id: uid(), name, amount, catId: cat(c).id, itemId: item(c, l), recurring: 'monthly', dueDay, paidMonths: [], dueDate: null, paid: false });
  s.payables = [
    pb('Rent', 1450, 'Housing', 'Rent / mortgage', 1), pb('Electric bill', 95, 'Utilities', 'Electric', 20),
    pb('Internet', 65, 'Utilities', 'Internet', 14), pb('Phone plan', 55, 'Utilities', 'Phone', 22),
    pb('Car insurance', 120, 'Transport', 'Car insurance', 9), pb('Streaming bundle', 23, 'Subscriptions', 'Streaming', 3),
    pb('Gym membership', 40, 'Health', 'Gym', 6)
  ];
  // mark bills before today as paid this month
  const mk = mkey(t);
  s.payables.forEach(p => { if (p.dueDay < t.getDate()) p.paidMonths.push(mk); });
  // deterministic sample spending for this month and the two before
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const add = (d, amt, c, l, note, payWith) => s.expenses.push({ id: uid(), date: iso(d), amount: round2(amt), catId: cat(c).id, itemId: item(c, l), note, payWith: payWith || '' });
  for (let back = 2; back >= 0; back--) {
    const first = addMonths(t, -back), last = back === 0 ? t : new Date(first.getFullYear(), first.getMonth(), dim(first.getFullYear(), first.getMonth()));
    for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
      const wd = d.getDay();
      if (wd === 6) add(d, 85 + rnd() * 45, 'Food', 'Groceries', 'Weekly shop', s.cards[0].id);
      if (wd === 1) add(d, 38 + rnd() * 18, 'Transport', 'Gas', 'Fill-up', s.cards[0].id);
      if (wd === 5 || (wd === 3 && rnd() > 0.5)) add(d, 22 + rnd() * 40, 'Food', 'Dining out', wd === 5 ? 'Friday dinner' : 'Lunch', s.cards[1].id);
      if (wd >= 1 && wd <= 5 && rnd() > 0.55) add(d, 4 + rnd() * 3, 'Food', 'Coffee', '', '');
      if (d.getDate() === 11) add(d, 60 + rnd() * 90, 'Shopping', 'Clothes', 'Seasonal clothes', s.cards[2].id);
      if (d.getDate() === 19) add(d, 25 + rnd() * 30, 'Health', 'Pharmacy', 'Prescriptions', '');
      if (d.getDate() === 24 && back !== 0) add(d, 70 + rnd() * 60, 'Fun', 'Concerts', 'Show tickets', s.cards[1].id);
      if (d.getDate() === 8) add(d, 30 + rnd() * 40, 'Shopping', 'Household', 'Cleaning supplies', '');
    }
  }
  s.goals = [
    { id: uid(), name: 'Summer trip (example)', target: 2000, saved: 450, targetDate: iso(new Date(t.getFullYear(), t.getMonth() + 8, 1)) },
    { id: uid(), name: 'New laptop (example)', target: 1400, saved: 300, targetDate: iso(new Date(t.getFullYear(), t.getMonth() + 5, 15)) }
  ];
  s.carry = { amount: 380, history: [{ month: mkey(addMonths(t, -1)), amount: 380 }] };
  return s;
}

function normalize(s) {
  const b = blankState();
  s = Object.assign(b, s || {});
  s.settings = Object.assign(blankState().settings, s.settings || {});
  s.carry = Object.assign({ amount: 0, history: [] }, s.carry || {});
  ['categories', 'expenses', 'cards', 'accounts', 'pay', 'payables', 'goals'].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  s.categories.forEach(c => { if (!Array.isArray(c.items)) c.items = []; });
  s.payables.forEach(p => { if (!Array.isArray(p.paidMonths)) p.paidMonths = []; });
  return s;
}

// ---------- storage ----------
const LS_KEY = 'paycheck-ledger-v1';
let store = { kind: 'none' };
let saveTimer = null, dirtyMonths = new Set(), mainDirty = false;

async function initStore() {
  let loaded = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if (db && id) {
        const col = db.collection('data/users/' + id);
        const snap = await col.get();
        store = { kind: 'cloud', col };
        if (snap.docs.length) {
          const main = snap.docs.find(d => d.id === 'main');
          if (main) {
            loaded = main.data().state || {};
            loaded.expenses = [];
            snap.docs.filter(d => d.id.startsWith('exp-')).forEach(d => { loaded.expenses.push(...((d.data() || {}).items || [])); });
          }
        }
      }
    } catch (e) { console.warn('Cloud storage unavailable, using this device', e); store = { kind: 'none' }; }
  }
  if (store.kind !== 'cloud') {
    store = { kind: 'local' };
    try { const raw = localStorage.getItem(LS_KEY); if (raw) loaded = JSON.parse(raw); } catch {}
  }
  S = loaded ? normalize(loaded) : exampleState();
  if (!loaded) S.example = true;
  setSaveState(S.example ? 'Showing examples' : (store.kind === 'cloud' ? 'Saved to your account' : 'Saved on this device'));
}

function setSaveState(t) { $('#save-state').textContent = t; }

function commit(opts = {}) {
  // call after any change; months = expense months touched
  if (S.example) { S.example = false; allExpenseMonths().forEach(m => dirtyMonths.add(m)); }
  (opts.months || []).forEach(m => dirtyMonths.add(m));
  mainDirty = true;
  render();
  clearTimeout(saveTimer);
  setSaveState('Saving…');
  saveTimer = setTimeout(flush, 600);
}

async function flush() {
  if (S.example) { setSaveState('Showing examples'); return; }
  try {
    if (store.kind === 'cloud') {
      const { expenses, ...rest } = S;
      if (mainDirty) { mainDirty = false; await store.col.doc('main').set({ state: rest, savedAt: new Date().toISOString() }); }
      const months = [...dirtyMonths]; dirtyMonths.clear();
      for (const m of months) {
        const items = expenses.filter(e => e.date.slice(0, 7) === m);
        if (items.length) await store.col.doc('exp-' + m).set({ items }); else await store.col.doc('exp-' + m).delete().catch(() => {});
      }
      setSaveState('Saved to your account');
    } else {
      localStorage.setItem(LS_KEY, JSON.stringify(S));
      mainDirty = false; dirtyMonths.clear();
      setSaveState('Saved on this device');
    }
  } catch (e) {
    console.error(e);
    setSaveState('Not saved — check your connection');
    toast('Your last change could not be saved. It will retry on your next edit.');
  }
}
const allExpenseMonths = () => [...new Set(S.expenses.map(e => e.date.slice(0, 7)))];

// ---------- domain calculations ----------
const catById = id => S.categories.find(c => c.id === id);
const catName = id => (catById(id) || { name: 'Uncategorized' }).name;
const itemLabel = (cid, iid) => { const c = catById(cid); const i = c && c.items.find(x => x.id === iid); return i ? i.label : ''; };
const monthRange = mk => { const d = parse(mk + '-01'); return [d, new Date(d.getFullYear(), d.getMonth(), dim(d.getFullYear(), d.getMonth()))]; };

function payDates(p, from, to) {
  const out = []; if (!p.nextDate) return out;
  const anchor = parse(p.nextDate);
  if (p.frequency === 'weekly' || p.frequency === 'biweekly') {
    const step = p.frequency === 'weekly' ? 7 : 14;
    let d = new Date(anchor);
    while (d > from) d = addDays(d, -step);
    for (; d <= to; d = addDays(d, step)) if (d >= from) out.push(new Date(d));
  } else {
    let y = from.getFullYear(), m = from.getMonth();
    while (new Date(y, m, 1) <= to) {
      const n = dim(y, m);
      const days = p.frequency === 'semimonthly' ? [15, n] : [Math.min(anchor.getDate(), n)];
      for (const dd of days) { const d = new Date(y, m, dd); if (d >= from && d <= to) out.push(d); }
      if (++m > 11) { m = 0; y++; }
    }
  }
  return out;
}
function paydaysBetween(from, to) {
  return S.pay.flatMap(p => payDates(p, from, to).map(d => ({ date: d, amount: +p.amount || 0, source: p.source, id: p.id }))).sort((a, b) => a.date - b.date);
}
const incomeInMonth = mk => { const [a, b] = monthRange(mk); return sum(paydaysBetween(a, b), x => x.amount); };
const monthlyIncome = () => sum(S.pay, p => (+p.amount || 0) * (FREQ[p.frequency] || FREQ.monthly).perMonth);

function payableDate(p, mk) {
  if (p.recurring === 'once') { return p.dueDate && p.dueDate.slice(0, 7) === mk ? parse(p.dueDate) : null; }
  const [a] = monthRange(mk); return new Date(a.getFullYear(), a.getMonth(), Math.min(+p.dueDay || 1, dim(a.getFullYear(), a.getMonth())));
}
const isPaid = (p, mk) => p.recurring === 'once' ? !!p.paid : p.paidMonths.includes(mk);
const payablesInMonth = mk => S.payables.map(p => ({ p, date: payableDate(p, mk) })).filter(x => x.date).sort((a, b) => a.date - b.date);
const expensesInMonth = mk => S.expenses.filter(e => e.date.slice(0, 7) === mk).sort((a, b) => b.date.localeCompare(a.date));
const monthlyFixed = () => sum(S.payables.filter(p => p.recurring !== 'once'), p => p.amount);

function avgMonthlySpend() {
  const cur = mkey(today());
  const months = [-3, -2, -1].map(n => mkey(addMonths(today(), n))).filter(m => S.expenses.some(e => e.date.slice(0, 7) === m));
  if (months.length) return sum(months, m => sum(expensesInMonth(m), e => e.amount)) / months.length;
  // only the current month has data: project it to a full month
  const spent = sum(expensesInMonth(cur), e => e.amount); const d = today();
  return d.getDate() > 0 ? spent / d.getDate() * dim(d.getFullYear(), d.getMonth()) : 0;
}

function goalMonthly(g) {
  const left = Math.max(0, (+g.target || 0) - (+g.saved || 0));
  if (!g.targetDate || left <= 0) return 0;
  const n = Math.max(1, monthsBetween(today(), parse(g.targetDate)));
  return left / n;
}

const minDue = c => (+c.minPay > 0 ? +c.minPay : Math.max(25, (+c.balance || 0) * 0.02));

function simulate(cards, budget, strategy) {
  const cs = cards.filter(c => +c.balance > 0).map(c => ({ id: c.id, name: c.name, apr: +c.apr || 0, min: minDue(c), bal: +c.balance, paidOff: null }));
  const series = [sum(cs, c => c.bal)];
  let month = 0, interest = 0, first = {};
  while (cs.some(c => c.bal > 0.005) && month < 360) {
    month++;
    const pays = {};
    for (const c of cs) if (c.bal > 0) { const i = c.bal * c.apr / 100 / 12; c.bal += i; interest += i; }
    let pool = budget;
    for (const c of cs) if (c.bal > 0.005) { const p = Math.min(c.bal, c.min); c.bal -= p; pool -= p; pays[c.id] = p; }
    if (strategy !== 'minimum') {
      const order = cs.filter(c => c.bal > 0.005).sort(strategy === 'avalanche' ? (a, b) => b.apr - a.apr || a.bal - b.bal : (a, b) => a.bal - b.bal || b.apr - a.apr);
      for (const c of order) { if (pool <= 0.005) break; const p = Math.min(c.bal, pool); c.bal -= p; pool -= p; pays[c.id] = (pays[c.id] || 0) + p; }
    }
    cs.forEach(c => { if (c.bal <= 0.005 && c.paidOff === null) { c.bal = 0; c.paidOff = month; } });
    if (month === 1) first = pays;
    series.push(sum(cs, c => c.bal));
  }
  const done = !cs.some(c => c.bal > 0.005);
  return { months: month, interest, series, first, done, payoff: Object.fromEntries(cs.map(c => [c.id, c.paidOff])) };
}

function buildPlan() {
  const income = monthlyIncome();
  const fixed = monthlyFixed();
  const spend = avgMonthlySpend();
  const essentials = fixed + spend;
  const savings = sum(S.accounts, a => a.balance);
  const bufferM = +S.settings.bufferMonths || 0;
  const target = bufferM * essentials;
  const gap = Math.max(0, target - savings);
  const savingsSetAside = gap > 0 ? Math.min(gap / 6, income * 0.1) : 0;
  const goals = sum(S.goals, goalMonthly);
  const cushion = income * 0.05;
  const cards = S.cards.filter(c => +c.balance > 0);
  const mins = sum(cards, c => Math.min(+c.balance, minDue(c)));
  const free = income - essentials - savingsSetAside - goals - cushion;
  const override = S.settings.debtBudgetOverride;
  const suggested = Math.max(mins, free);
  const budget = override != null && override !== '' ? Math.max(mins, +override) : suggested;
  const shortfall = Math.max(0, mins - (income - essentials));
  const strategy = view.strategy || S.settings.strategy || 'avalanche';
  const runs = {
    avalanche: simulate(cards, budget, 'avalanche'),
    snowball: simulate(cards, budget, 'snowball'),
    minimum: simulate(cards, mins, 'minimum')
  };
  return { income, fixed, spend, essentials, savings, target, gap, savingsSetAside, goals, cushion, mins, free, budget, suggested, shortfall, strategy, runs, run: runs[strategy], cards, debt: sum(cards, c => c.balance) };
}

function nextDue(c, from = today()) {
  let d = new Date(from.getFullYear(), from.getMonth(), Math.min(+c.dueDay || 1, dim(from.getFullYear(), from.getMonth())));
  if (d < from) { const n = addMonths(from, 1); d = new Date(n.getFullYear(), n.getMonth(), Math.min(+c.dueDay || 1, dim(n.getFullYear(), n.getMonth()))); }
  return d;
}

function schedulePayments(plan) {
  // Match each card payment to the latest paycheck at least 3 days before its due date.
  const t = today();
  const paydays = paydaysBetween(t, addDays(t, 75));
  const rows = plan.cards.map(c => {
    const amt = plan.run.first[c.id] || 0;
    const due = nextDue(c);
    const eligible = paydays.filter(p => p.date <= addDays(due, -3));
    const from = eligible.length ? eligible[eligible.length - 1] : null;
    return { c, amt, due, from };
  }).sort((a, b) => a.due - b.due);
  // load per paycheck: bills due before the next paycheck plus card payments assigned to it
  const loads = paydays.slice(0, 4).map((pd, i) => {
    const next = paydays[i + 1] ? paydays[i + 1].date : addDays(pd.date, 14);
    const bills = [];
    [mkey(pd.date), mkey(addMonths(pd.date, 1))].forEach(mk => payablesInMonth(mk).forEach(x => { if (x.date >= pd.date && x.date < next && !isPaid(x.p, mk)) bills.push(x); }));
    const cardsHere = rows.filter(r => r.from && +r.from.date === +pd.date && r.from.id === pd.id);
    const load = sum(bills, x => x.p.amount) + sum(cardsHere, r => r.amt);
    return { pd, bills, cardsHere, load };
  });
  return { rows, loads };
}

function buildTips(plan) {
  const tips = [];
  const fmtMo = n => n >= 360 ? 'over 30 years' : n >= 24 ? `${(n / 12).toFixed(1)} years` : `${n} month${n === 1 ? '' : 's'}`;
  if (!plan.cards.length) { tips.push({ k: 'good', t: 'No card balances entered. Add a card to get a payoff plan.' }); return tips; }
  if (!S.pay.length) tips.push({ k: 'warn', t: 'Add your pay so the plan can tell how much you can safely put toward cards.' });
  if (plan.shortfall > 0) {
    const top = topCategories(mkey(today()), false)[0];
    tips.push({ k: 'bad', t: `<b>Minimums don't fit yet.</b> Card minimums total ${money(plan.mins)}, but after bills and typical spending you have about ${money(plan.income - plan.essentials)} a month. Pay every minimum first so you avoid late fees and credit damage, and trim about ${m0(plan.shortfall)} from spending${top ? `, starting with ${esc(top.name)} (${m0(top.total)} this month)` : ''}.` });
  }
  if (plan.gap > 0) {
    const covered = plan.essentials > 0 ? plan.savings / plan.essentials : 0;
    tips.push({ k: 'warn', t: `<b>Keep your safety cushion.</b> Savings cover ${covered.toFixed(1)} months of essentials; your goal is ${S.settings.bufferMonths}. The plan keeps ${money(plan.savingsSetAside)} a month going to savings instead of throwing every spare dollar at cards, so one surprise bill doesn't land back on a card.` });
  } else if (plan.savings > plan.target && plan.debt > 0) {
    const extra = plan.savings - plan.target;
    const hi = [...plan.cards].sort((a, b) => b.apr - a.apr)[0];
    const lump = Math.min(extra / 2, hi.balance);
    if (lump >= 50 && hi.apr > 0) tips.push({ k: 'accent', t: `<b>Optional lump sum.</b> You hold ${m0(extra)} above your ${S.settings.bufferMonths}-month cushion. Moving up to ${m0(lump)} (half of that) to ${esc(hi.name)} at ${hi.apr}% saves roughly ${m0(lump * hi.apr / 100)} a year in interest and still leaves your cushion intact.` });
  }
  if (plan.budget >= plan.debt) tips.push({ k: 'good', t: `<b>You can pay every card in full this month</b> (${money(plan.debt)}) and stay within your budget. Paying statement balances in full means no interest at all.` });
  const av = plan.runs.avalanche, sb = plan.runs.snowball, mn = plan.runs.minimum;
  if (av.done && sb.done && plan.cards.length > 1) {
    const diff = sb.interest - av.interest;
    const firstSb = Math.min(...Object.values(sb.payoff).filter(Boolean)), firstAv = Math.min(...Object.values(av.payoff).filter(Boolean));
    tips.push({ k: 'accent', t: `<b>Avalanche vs snowball.</b> Paying the highest rate first saves ${money(Math.max(0, diff))} in interest. Paying the smallest balance first clears your first card in ${fmtMo(firstSb)}${firstSb < firstAv ? ` instead of ${fmtMo(firstAv)}` : ''}, which some people find easier to stick with.` });
  }
  if (mn.done || mn.months >= 360) {
    tips.push({ k: mn.done ? 'accent' : 'bad', t: mn.done ? `<b>Why pay more than minimums:</b> minimums alone take ${fmtMo(mn.months)} and cost ${m0(mn.interest)} in interest. Your plan takes ${fmtMo(plan.run.months)} and costs ${m0(plan.run.interest)}.` : `<b>Minimum payments alone never clear this debt</b> because interest grows faster than the minimums. Any amount above the minimum makes a real difference.` });
  }
  const totalLimit = sum(S.cards, c => c.limit);
  if (totalLimit > 0) {
    const u = plan.debt / totalLimit;
    if (u > 0.3) tips.push({ k: u > 0.5 ? 'bad' : 'warn', t: `<b>Overall utilization is ${(u * 100).toFixed(0)}%.</b> Credit scores tend to improve below 30% (${m0(totalLimit * 0.3)} across your cards). Avoid closing paid-off cards, since that lowers your total limit.` });
  }
  S.cards.filter(c => c.limit > 0 && c.balance / c.limit > 0.7).forEach(c => tips.push({ k: 'warn', t: `<b>${esc(c.name)} is ${(c.balance / c.limit * 100).toFixed(0)}% used.</b> Pause new charges on it until the balance drops.` }));
  const promo = S.cards.filter(c => +c.balance > 0 && +c.apr === 0);
  if (promo.length) tips.push({ k: 'accent', t: `<b>${promo.map(c => esc(c.name)).join(', ')} at 0%.</b> The plan pays these last, but check the promo end date and clear the balance before the rate jumps.` });
  tips.push({ k: 'accent', t: 'Turn on autopay for at least the minimum on every card, then pay the extra by hand from the paycheck listed below. A missed minimum costs more than any strategy saves.' });
  return tips;
}

function topCategories(mk, inclBills) {
  const map = new Map();
  const addTo = (cid, iid, amt, label) => {
    const key = cid || 'none';
    if (!map.has(key)) map.set(key, { id: key, name: catName(cid), total: 0, items: new Map() });
    const c = map.get(key); c.total += amt;
    const ik = iid || label || 'Unlabeled';
    const lab = itemLabel(cid, iid) || label || 'No description';
    c.items.set(ik, { label: lab, total: ((c.items.get(ik) || {}).total || 0) + amt });
  };
  expensesInMonth(mk).forEach(e => addTo(e.catId, e.itemId, +e.amount, e.note));
  if (inclBills) payablesInMonth(mk).forEach(x => addTo(x.p.catId, x.p.itemId, +x.p.amount, x.p.name));
  return [...map.values()].sort((a, b) => b.total - a.total).map(c => ({ ...c, items: [...c.items.values()].sort((a, b) => b.total - a.total) }));
}

// ---------- rendering ----------
const TABS = [['overview', 'Overview'], ['spending', 'Spending'], ['cards', 'Cards & payoff'], ['income', 'Pay & bills'], ['savings', 'Savings & goals'], ['categories', 'Categories'], ['prefs', 'Settings']];

function render() {
  if (!S) return;
  if (!TABS.some(t => t[0] === view.tab)) view.tab = 'overview';
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${view.tab === k}" data-action="tab" data-id="${k}">${l}</button>`).join('');

  const views = { overview: vOverview, spending: vSpending, cards: vCards, income: vIncome, savings: vSavings, categories: vCategories, prefs: vSettings };
