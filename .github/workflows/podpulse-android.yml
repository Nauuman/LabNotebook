name: PodPulse Android app

on:
  push:
    paths:
      - "airpods-battery/**"
      - ".github/workflows/podpulse-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: airpods-battery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PodPulse-apk
          path: airpods-battery/app/build/outputs/apk/debug/app-debug.apk
