name: Paycheck Ledger website

on:
  push:
    paths:
      - 'budget/**'
      - '.github/workflows/budget-website.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: budget-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the website
        run: |
          sh budget/build.sh
          mkdir -p _site
          cp budget/index.html _site/index.html
          touch _site/.nojekyll

      - name: Publish to the gh-pages branch
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy Paycheck Ledger website from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Turn on GitHub Pages for gh-pages (first run only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1 && exit 0
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/"
